button.del:hover{background:#fce8e6;border-color:var(--bad)}
table.pres-tbl{min-width:1100px}
table.pres-tbl th,table.pres-tbl td{padding:6px 4px;vertical-align:top}
table.pres-tbl textarea{min-height:48px;line-height:1.35}
table.pres-tbl select{min-width:150px}

function save(immediate){
  clearTimeout(tm);
  const doSave=()=>{
    try{
      _writing=true;
      localStorage.setItem(STORAGE_KEY,JSON.stringify(S));
      localStorage.setItem(STORAGE_KEY+'__ping',String(Date.now()));
      setTimeout(()=>{_writing=false},60);
      const h=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      sync('Actualizado · '+h);
    }catch(e){
      _writing=false;
      sync('Error al guardar (¿espacio lleno?)');
    }
  };
  if(immediate){doSave();return}
  sync('Guardando…');
  tm=setTimeout(doSave,150);
}
function load(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return false;
    const sv=JSON.parse(raw);
    S={...JSON.parse(JSON.stringify(D)),...sv};
    return true;
  }catch(e){return false}
}
// Sincroniza entre pestañas del mismo navegador en tiempo real
window.addEventListener('storage',e=>{
  if(_writing)return;
  if(e.key!==STORAGE_KEY&&e.key!==STORAGE_KEY+'__ping')return;
  if(!load())return;
  const ae=document.activeElement;
  if(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)){calc();return}
  render();
  sync('Sincronizado entre pestañas ✓');
});

const HIST_MAX=40;
let hist=[];
let histFocusKey='';
function pushHist(){
  try{
    hist.push(JSON.stringify(S));
    if(hist.length>HIST_MAX)hist.shift();
    updateUndoBtn();
  }catch(_){}
}
function undo(){
  if(!hist.length){sync('No hay cambios que deshacer');return}
  try{
    const prev=JSON.parse(hist.pop());
    Object.keys(S).forEach(k=>delete S[k]);
    Object.assign(S,prev);
    histFocusKey='';
    save(true);render();
    sync('Deshecho · quedan '+hist.length+' pasos');
    updateUndoBtn();
  }catch(e){sync('No se pudo deshacer')}
}
function updateUndoBtn(){
  const n=hist.length;
  document.querySelectorAll('#undo, #undo2').forEach(b=>{
    if(!b)return;
    b.disabled=!n;
    b.title=n?'Deshacer último cambio ('+n+')':'Edita un campo o borra una línea para poder deshacer';
    b.textContent=n?'↩ Deshacer ('+n+')':'↩ Deshacer';
    b.style.opacity=n?'1':'0.7';
  });
}

function calc(){
  if(tab!='pres')return;
  const sum=a=>a.reduce((t,f)=>t+(+f.m||0),0);
  const is=S.flujo.filter(f=>f.t=='Ingreso'),ing=sum(is);
  S.pres.forEach((r,i)=>{
    const e=$('#s'+i);
    if(e){
      const plan=(+r.n||0)*(+r.p||0), gasto=+r.x||0;
      e.textContent=$m(plan);
      e.style.color=gasto>plan&&plan>0?'var(--bad)':'';
    }
  });
  const{p,x}=tot(),by={};
  const tt=$('#tt'),tg=$('#tg'),tc=$('#tc');
  if(tt)tt.textContent=$m(p);
  if(tg)tg.textContent=$m(x);
  if(tc){const n=comprobados(),totL=S.pres.length;tc.textContent=n+' / '+totL+(totL?` (${Math.round(n/totL*100)}%)`:'')}
  S.pres.forEach(r=>{by[r.g]=by[r.g]||[0,0];by[r.g][0]+=(+r.n||0)*(+r.p||0);by[r.g][1]+=(+r.x||0)});
  const resu=$('#resu');
  if(resu)resu.innerHTML=`<div><div class="lbl">Planeado</div><div class="big">${$m(p)}</div></div><div><div class="lbl">Gastado</div><div class="big">${$m(x)}</div></div><div><div class="lbl">${p>S.cap?'Excede tope':'Disponible vs. tope'}</div><div class="big" style="color:${p>S.cap?'var(--bad)':'var(--ok)'}">${$m(Math.abs(S.cap-p))}</div></div><div><div class="lbl">Comprobados (PDF+XML+fecha)</div><div class="big">${comprobados()}</div><small>de ${S.pres.length} líneas</small></div>`+Object.entries(by).map(([g,v])=>`<div><div class="lbl">${esc(g)}</div><b>${$m(v[0])}</b> <span class="pill">${p?Math.round(v[0]/p*100):0}%</span><br><small>gastado ${$m(v[1])}</small></div>`).join('');
  let acc=0;S.flujo.forEach((f,i)=>{acc+=(f.t=='Ingreso'?1:-1)*(+f.m||0);const e=$('#f'+i);if(e){e.textContent=$m(acc);e.style.color=acc<0?'var(--bad)':''}});
  // Flujo mensual desde presupuesto (gastos) + ingresos
  const mk=d=>d?String(d).slice(0,7):'Sin fecha';
  const mi={},mg={};
  is.forEach(f=>{const k=mk(f.d);mi[k]=(mi[k]||0)+(+f.m||0)});
  S.pres.forEach(r=>{if(!(+r.x))return;const k=mk(r.d);mg[k]=(mg[k]||0)+(+r.x||0)});
  const ms=[...new Set([...Object.keys(mi),...Object.keys(mg)])].sort();
  const mn=k=>k=='Sin fecha'?k:new Date(k+'-01T00:00:00Z').toLocaleDateString('es-MX',{month:'long',year:'numeric',timeZone:'UTC'});
  let ac=0;
  const pendientes=S.pres.filter(r=>(+r.x||0)>0&&!(r.d&&String(r.pdf||'').trim()&&String(r.xml||'').trim()));
  const fl=$('#fl');
  if(fl)fl.innerHTML=`<div class="grid"><div><div class="lbl">Ingresos registrados</div><div class="big">${$m(ing)}</div></div><div><div class="lbl">Gastos (presupuesto)</div><div class="big">${$m(x)}</div></div><div><div class="lbl">Saldo (ingresos − gastos)</div><div class="big" style="color:${ing-x<0?'var(--bad)':'#000'}">${$m(ing-x)}</div></div><div><div class="lbl">Por gastar del planeado</div><div class="big">${$m(p-x)}</div></div></div>
  <div class="grid" style="margin-top:14px"><div class="wrap"><table style="min-width:0"><tr><th>Mes</th><th class="r">Ingresos</th><th class="r">Gastos</th><th class="r">Saldo acum.</th></tr>${ms.map(k=>{ac+=(mi[k]||0)-(mg[k]||0);return `<tr><td style="text-transform:capitalize">${mn(k)}</td><td class="r">${$m(mi[k]||0)}</td><td class="r">${$m(mg[k]||0)}</td><td class="r" style="color:${ac<0?'var(--bad)':''}">${$m(ac)}</td></tr>`}).join('')||'<tr><td colspan="4">Sin movimientos aún</td></tr>'}</table></div>
  <div class="wrap"><table style="min-width:0"><tr><th>Pendientes de comprobar</th><th class="r">Gastado</th></tr>${pendientes.map(r=>`<tr><td>${esc(r.c)}${r.d?' · '+esc(r.d):' · <span style="color:var(--bad)">sin fecha</span>'}${!String(r.pdf||'').trim()?' · <span style="color:var(--bad)">sin PDF</span>':''}${!String(r.xml||'').trim()?' · <span style="color:var(--bad)">sin XML</span>':''}</td><td class="r">${$m(+r.x||0)}</td></tr>`).join('')||'<tr><td colspan="2">Todo lo gastado tiene fecha + PDF + XML ✓</td></tr>'}</table></div></div>
  <p class="sub" style="margin-top:10px">Los gastos salen de la columna <b>Gastado $</b> de cada concepto. Un gasto está <b>comprobado</b> cuando tiene fecha, link PDF y link XML.</p>`;
}

const fit=()=>document.querySelectorAll('textarea').forEach(e=>{e.style.height='auto';e.style.height=(e.scrollHeight+2)+'px'});
function applyField(t){
  if(!t.dataset||!t.dataset.k)return false;
  const r=S[t.dataset.a]&&S[t.dataset.a][t.dataset.i];
  if(!r)return false;
  r[t.dataset.k]=t.type=='checkbox'?t.checked:t.dataset.n?(parseFloat(t.value)||0):t.value;
  if(t.tagName=='SELECT'&&t.dataset.k=='e')t.className='st-'+t.value.replace(/ /g,'');
  if(((t.dataset.a.startsWith('lk_')&&t.dataset.k=='u')||t.dataset.k=='pdf'||t.dataset.k=='xml')&&t.value.trim()&&!/^https?:\/\//i.test(t.value.trim())){
    r[t.dataset.k]='https://'+t.value.trim();
    t.value=r[t.dataset.k];
  }
  return true;
}
// Al enfocarse en un campo editable, guarda snapshot para poder deshacer ese cambio
document.addEventListener('focusin',e=>{
  const t=e.target;
  if(!t||!t.dataset)return;
  if(t.id==='cap'){
    if(histFocusKey!=='cap'){pushHist();histFocusKey='cap'}
    return;
  }
  if(t.dataset.a!=null&&t.dataset.k!=null&&t.dataset.i!=null){
    const key=t.dataset.a+':'+t.dataset.i+':'+t.dataset.k;
    if(key!==histFocusKey){pushHist();histFocusKey=key}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.tagName=='TEXTAREA'){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px'}
  if(t.id=='cap'){S.cap=+t.value||0;save();return}
  if(applyField(t)){save();calc()}
});
addEventListener('resize',fit);document.fonts&&document.fonts.ready.then(fit);

// Eventos
document.addEventListener('dragstart',e=>{const d=e.target.dataset&&e.target.dataset.drag;if(d){DRG=d;e.dataTransfer.setData('text/plain',d);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const tr=e.target.closest&&e.target.closest('tr[data-row]');if(DRG&&tr&&tr.dataset.row.split(':')[0]==DRG.split(':')[0]){e.preventDefault();document.querySelectorAll('tr[data-row]').forEach(r=>r.style.outline='');tr.style.outline='2px solid var(--acc)'}});
document.addEventListener('drop',e=>{const tr=e.target.closest&&e.target.closest('tr[data-row]');if(!DRG||!tr)return;e.preventDefault();const[k,i]=DRG.split(':'),[k2,j]=tr.dataset.row.split(':');DRG=null;if(k==k2)mv(k,+i,+j)});
document.addEventListener('dragend',()=>{DRG=null;document.querySelectorAll('tr[data-row]').forEach(r=>r.style.outline='')});

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset.t){tab=t.dataset.t;render()}
  if(t.dataset.nav){if(t.dataset.nav=='hoy'){cy=new Date().getFullYear();cm=new Date().getMonth()}else{cm+=+t.dataset.nav;if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}}render()}
  if(t.dataset.mv){const[k,i,d]=t.dataset.mv.split(':');mv(k,+i,+i+ +d)}
  if(t.dataset.sort){const[k,f]=t.dataset.sort.split(':');pushHist();S[k].sort((a,b)=>String(a[f]).localeCompare(String(b[f]),'es'));save();render()}
  if(t.dataset.rmv){const[i,d]=t.dataset.rmv.split(':').map(Number),j=i+d;if(j>=0&&j<S.rubros.length){pushHist();[S.rubros[i],S.rubros[j]]=[S.rubros[j],S.rubros[i]];save();render()}}
  if(t.dataset.rdel){const i=+t.dataset.rdel,g=S.rubros[i];if(S.pres.some(r=>r.g==g)){sync('Mueve primero sus líneas a otro rubro')}else{pushHist();S.rubros.splice(i,1);save();render()}}
  if(t.dataset.ver||t.dataset.dl){sync('Usa los links de Drive')}
  if(t.dataset.qa){const c=$('#qc').value.trim();if(!c){$('#qc').focus();return}pushHist();S.pres.push({g:$('#qg').value,c,n:parseFloat($('#qn').value)||0,p:parseFloat($('#qp').value)||0,x:0,d:'',pdf:'',xml:'',f:'Pendiente'});save();render()}
  if(t.dataset.rb){const r=$('#qr').value.trim();if(r&&!rubros().includes(r)){pushHist();S.rubros.push(r);save();render()}}
  if(t.dataset.add){pushHist();S[t.dataset.add].push({...NEW[t.dataset.add],...(t.dataset.s?{s:t.dataset.s}:{})});save();render()}
  if(t.dataset.del){const[k,i]=t.dataset.del.split(':');pushHist();S[k].splice(+i,1);save();render()}
  if(t.id=='shb'){const i=+$('#shf').value,n=+$('#shn').value||0,d0=S.tasks[i].d;if(d0){pushHist();S.tasks.forEach(x=>{if(x.d&&x.d>=d0)x.d=addD(x.d,n)});save();render()}}
  if(t.id=='undo'||t.id=='undo2'||(t.closest&&(t.closest('#undo')||t.closest('#undo2')))){undo()}
  if(t.id=='restPres'){restorePresOriginal()}
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id=='cap'){S.cap=+t.value||0;save(true);return}
  if(!applyField(t))return;
  save(true);calc();
  // re-render cuando el cambio afecta otras vistas (calendario, rubros, etc.)
  if(tab=='cal'||t.dataset.a.startsWith('lk_')||(t.dataset.a=='flujo'&&t.dataset.k=='d')||(t.dataset.a=='pres'&&(t.dataset.k=='g'||t.dataset.k=='pdf'||t.dataset.k=='xml'))||t.dataset.k=='e'||t.type=='checkbox')render();
});

$('#exp').onclick=async()=>{
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const secs={
    Cronograma:['tasks',['fa','d','a','r','e','l']],
    'Checklist SEDECULTA':['chk',['r','e','f','ok']],
    'Compromisos propuesta':['comp',['n','m','f','ok']],
    'Plan de medios':['med',['n','c','f','e']],
    Arte:['arte',['n','s','q','e','r','o']],
    'Props y escenografia':['props',['n','s','q','e','r','o']],
    'Vestuario y maquillaje':['vest',['n','s','q','e','r','o']],
    'Flujo de efectivo':['flujo',['d','t','q','c','x','m']],
    Directorio:['dir',['n','r','o','t','m','x']],
    'Eventos adicionales':['cal',['d','n','e']],
    Guion:['gui',['t','d','pj','a','tl','so']],
    Personajes:['pers',['n','e','d']],
    'Necesidades por escena':['need',['s','c','n','q','e','r','o']],
    Presupuesto:['pres',['g','c','n','p','x','d','pdf','xml','f']]
  };
  let out='\ufeff';
  for(const[t,[k,c]]of Object.entries(secs)){out+=q(t)+'\n'+S[k].map(r=>c.map(f=>q(r[f])).join(',')).join('\n')+'\n\n'}
  for(const t of TABS){const L=S['lk_'+t[0]]||[];if(L.length)out+=q('Links Drive · '+t[1])+'\n'+L.map(r=>q(r.t)+','+q(r.u)).join('\n')+'\n\n'}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([out],{type:'text/csv;charset=utf-8'}));
  a.download='hijas-del-barro.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  sync('CSV descargado ✓');
};

// Arranque: cargar datos guardados y mantener actualizado
(function init(){
  const loaded=load();
  render();
  sync(loaded?'Datos recuperados · actualización continua ✓':'Listo · se actualiza solo al editar');
  // refresca el Panorama cada 30 s si está abierto (countdown, etc.)
  setInterval(()=>{if(tab==='pan')render()},30000);
})();
</script>
